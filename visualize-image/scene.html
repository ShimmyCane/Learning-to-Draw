<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualize Image gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
 .big{max-width:min(100%,calc((100dvh - 250px) * var(--ar,1)));margin:0 auto}
 .big svg{display:block;width:100%;height:auto}
 .steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
 .cap{font:26px var(--hand);margin:10px 0 2px;text-align:center}
 .rule{text-align:center;font-weight:600}
 .here{text-align:center;opacity:.8;margin:4px 0 0}
 .stage:fullscreen{background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:16px}
 .stage:fullscreen .big{max-width:min(96vw,calc((100dvh - 170px) * var(--ar,1)))}
</style></head>
<body>
<header class="top"><h1 class="title"><a href="index.html">Visualize Image</a> <small id="sub">…</small></h1><a class="chip" id="sheets" href="#">🖨️ Sheets</a></header>
<main class="wrap">
 <div class="steps" id="steps"></div>
 <div class="row" style="margin-bottom:10px;justify-content:center">
  <button class="btn" id="prev" type="button" aria-label="Previous">◀</button>
  <button class="btn on" id="auto" type="button">▶ Play</button>
  <button class="btn" id="next" type="button" aria-label="Next">▶|</button>
  <button class="btn mint" id="full" type="button">⛶ Full screen</button>
 </div>
 <div class="stage" id="stage"><div class="paper big" id="page"></div><div class="cap" id="ft"></div><div class="rule" id="rule"></div><p class="here" id="here"></p></div>
 <div id="extra"></div>
</main>
<script src="js/settings.js"></script>
<script src="js/viz.js"></script>
<script src="js/mine.js"></script>
<script>
(function(){
 const q=new URLSearchParams(location.search), id=q.get("id")||"VI-002", $=s=>document.getElementById(s);
 VM.loadScene(id,()=>start(),()=>{$("sub").textContent="Scene "+id+" not found";VS.mount({})});
 function start(){
  VS.mount({id:id,onChange:k=>{ if(k==="scene"||VS.sceneGone(id)) location.href="index.html"; }});
  if(VS.sceneGone(id)){ $("stage").innerHTML='<p style="padding:30px;text-align:center;font:26px var(--hand)">This scene is deleted on this device. Restore it in ⚙️.</p>'; return; }
  const sc=VI.scenes[id],F=VI.FRAMES; let i=Math.max(0,F.findIndex(f=>f.id===q.get("f"))),timer=null;
  $("sub").textContent=sc.title+" ("+sc.id+")"; $("sheets").href="sheet.html?id="+id; document.title=sc.title+" · gallery";
  Object.entries(VI.STEPS).forEach(([k,st])=>{const b=document.createElement("button");b.className="tag";b.dataset.step=k;b.textContent=k+". "+st.name;b.onclick=()=>{i=F.findIndex(f=>f.step===k);draw()};$("steps").appendChild(b)});
  const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
  function draw(){
   const f=F[i],st=VI.STEPS[f.step]; $("page").innerHTML=VI.frameSVG(sc,f,false);
   const c=f.kind==="crop"?sc.size:[sc.crop.w,sc.crop.h]; $("page").style.setProperty("--ar",c[0]/c[1]); $("stage").style.setProperty("--ar",c[0]/c[1]);
   $("ft").textContent=f.id+" · "+f.title; $("rule").textContent=st.rule; $("here").textContent="In this picture: "+(sc.notes[f.id]||"");
   document.querySelectorAll("#steps .tag").forEach(b=>b.classList.toggle("on",b.dataset.step===f.step));
   let x=""; if(f.id==="1") x='<div class="panel paper" style="margin-top:14px;padding:10px 16px"><h3 style="font:24px var(--hand);margin:0">What is nice</h3>'+li(sc.nice)+'<p><b>Crop:</b> '+sc.crop.why+'</p><p><b>Horizon:</b> '+sc.horizon.how+'</p><h3 style="font:24px var(--hand);margin:0">Try moving</h3>'+li(sc.moves)+'</div>';
   if(f.id==="4") x='<div class="panel paper" style="margin-top:14px;padding:10px 16px"><p><b>Vision:</b> '+sc.vision+'</p><h3 style="font:24px var(--hand);margin:0">Left back</h3>'+li(sc.leftOut)+'</div>';
   $("extra").innerHTML=x; history.replaceState(null,"","?id="+id+"&f="+f.id);
  }
  const go=d=>{i=(i+d+F.length)%F.length;draw()};
  $("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
  $("auto").onclick=()=>{ if(timer){clearInterval(timer);timer=null;$("auto").textContent="▶ Play";$("auto").classList.add("on")} else {timer=setInterval(()=>go(1),3500);$("auto").textContent="⏸ Pause";$("auto").classList.remove("on")} };
  $("full").onclick=()=>{ const e=$("stage"); document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen&&e.requestFullscreen()) };
  addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
  draw();
 }
})();
</script></body></html>
